apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bank-api
  template:
    metadata:
      labels:
        app: bank-api
    spec:
      # VULN-026 (Checkov CKV_K8S_20): hostNetwork enabled
      hostNetwork: false
      containers:
        - name: bank-api
          image: bank-api@sha256:3a1b2c4d5e6f7890abcdef1234567890abcdef1234567890abcdef1234567890
          securityContext:
            # VULN-028 (Checkov CKV_K8S_23): privileged container
            privileged: true
            # VULN-029 (Checkov CKV_K8S_20): runAsNonRoot not set / runs as root
            runAsNonRoot: false
            # VULN-030 (Checkov CKV_K8S_9): allowPrivilegeEscalation not disabled
            allowPrivilegeEscalation: true
          ports:
            - containerPort: 5000
          env:
            # VULN-031 (Gitleaks/Checkov: hardcoded secret in manifest env)
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
        # Removed docker-sock volumeMount and hostPath volume to eliminate Docker socket exposure
---
apiVersion: v1
kind: Service
metadata:
  name: bank-api-svc
spec:
  type: LoadBalancer  # VULN-034 (Checkov CKV_K8S_...): public LB with no network policy present
  selector:
    app: bank-api
  ports:
    - port: 80
      targetPort: 5000

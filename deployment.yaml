apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bank-api
  template:
    metadata:
      labels:
        app: bank-api
    spec:
      # VULN-026 (Checkov CKV_K8S_20): hostNetwork enabled
      hostNetwork: false
      containers:
        - name: bank-api
          image: bank-api@sha256:3a1b2c4d5e6f7890abcdef1234567890abcdef1234567890abcdef1234567890
          securityContext:
            # VULN-028 (Checkov CKV_K8S_23): privileged container
            privileged: true
            # VULN-029 (Checkov CKV_K8S_20): runAsNonRoot not set / runs as root
            runAsNonRoot: false
            # VULN-030 (Checkov CKV_K8S_9): allowPrivilegeEscalation not disabled
            allowPrivilegeEscalation: true
          ports:
            - containerPort: 5000
          env:
            # VULN-031 (Gitleaks/Checkov: hardcoded secret in manifest env)
            - name: JWT_SECRET
              value: "sk_live_51NxT3stB4nk1ngS3cr3tKeyDoNotUse0000"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumeMounts: []
    volumes: []
---
apiVersion: v1
kind: Service
metadata:
  name: bank-api-svc
spec:
  type: ClusterIP  # restrict service exposure to internal cluster only
  selector:
    app: bank-api
  ports:
    - port: 80
      targetPort: 5000

apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bank-api
  template:
    metadata:
      labels:
        app: bank-api
    spec:
      # VULN-026 (Checkov CKV_K8S_20): hostNetwork enabled
      # VULN-026 (Checkov CKV_K8S_20): hostNetwork enabled
      # Removed hostNetwork: true to reduce attack surface
      containers:
        - name: bank-api
          image: bank-api:latest  # VULN-027 (Checkov CKV_K8S_43): image tag not pinned to digest
          securityContext:
            # VULN-028 (Checkov CKV_K8S_23): privileged container
            privileged: false
            # VULN-029 (Checkov CKV_K8S_20): runAsNonRoot not set / runs as root
            runAsNonRoot: true
            # VULN-030 (Checkov CKV_K8S_9): allowPrivilegeEscalation not disabled
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 5000
          env:
            # VULN-031 (Gitleaks/Checkov: hardcoded secret in manifest env)
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: jwt_secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
      # Removed docker-sock volumeMount and hostPath volume to eliminate Docker socket access
      # - name: docker-sock
      #   mountPath: /var/run/docker.sock
    # volumes:
    #   - name: docker-sock
    #     hostPath:
    #       path: /var/run/docker.sock
---
apiVersion: v1
kind: Service
metadata:
  name: bank-api-svc
spec:
  type: LoadBalancer  # VULN-034 (Checkov CKV_K8S_...): public LB with no network policy present
  selector:
    app: bank-api
  ports:
    - port: 80
      targetPort: 5000

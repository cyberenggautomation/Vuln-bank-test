apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bank-api
  template:
    metadata:
      labels:
        app: bank-api
    spec:
      # VULN-026 (Checkov CKV_K8S_20): hostNetwork enabled
      hostNetwork: false
      containers:
        - name: bank-api
          image: bank-api:latest  # VULN-027 (Checkov CKV_K8S_43): image tag not pinned to digest
          securityContext:
            # VULN-028 (Checkov CKV_K8S_23): privileged container
            privileged: true
            # VULN-029 (Checkov CKV_K8S_20): runAsNonRoot not set / runs as root
            runAsNonRoot: false
            # VULN-030 (Checkov CKV_K8S_9): allowPrivilegeEscalation not disabled
            allowPrivilegeEscalation: true
          ports:
            - containerPort: 5000
          env:
            # VULN-031 (Gitleaks/Checkov: hardcoded secret in manifest env)
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # Removed mounting of Docker socket to eliminate host Docker daemon access
          # - name: docker-sock
          #   mountPath: /var/run/docker.sock
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        runAsNonRoot: true
    volumes:
      # - name: docker-sock
      #   hostPath:
      #     path: /var/run/docker.sock
---
apiVersion: v1
kind: Service
metadata:
  name: bank-api-svc
spec:
  type: ClusterIP  # Changed from LoadBalancer to ClusterIP to remove public exposure
  selector:
    app: bank-api
  ports:
    - port: 80
      targetPort: 5000

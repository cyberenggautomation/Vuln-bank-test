version: "3.8"

services:
  bank-api:
    build: .
    # VULN-021 (Checkov CKV_DOCKER: privileged container)
    privileged: true
    ports:
      - "5000:5000"
    environment:
      # VULN-022 (Gitleaks: hardcoded credential in compose env)
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  db:
    image: postgres:9.6
    # VULN-025 (Checkov: exposed DB port to host network with weak default creds)
    # Removed port exposure to host to prevent unauthorized access
    environment:
      - POSTGRES_PASSWORD=Sup3rS3cretPass!
      - POSTGRES_USER=postgres
